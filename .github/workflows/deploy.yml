name: Deploy Application

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'contabo'
        type: choice
        options:
          - contabo
          - hetzner

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}-backend:latest
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}-frontend:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Backend
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}

      # Build & Push Frontend
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'contabo' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'deployer' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          target: /opt/docker/apps/home-studio
          source: "docker-compose.yml,nginx/nginx.conf"

      - name: Deploy via SSH to VPS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'deployer' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/docker/apps/home-studio
            cd /opt/docker/apps/home-studio

            # Generate / update environment configuration
            cat << 'EOF' > .env
            DB_HOST=shared-postgres
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME || 'homestudio' }}
            DB_USER=${{ secrets.DB_USER || 'postgres' }}
            DB_PASS=${{ secrets.SHARED_DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS || 'https://homestudio.optivra.am' }}
            IMAGE_BACKEND=${{ env.IMAGE_BACKEND }}
            IMAGE_FRONTEND=${{ env.IMAGE_FRONTEND }}
            EOF

            # Authenticate with GitHub Container Registry
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER || github.actor }} --password-stdin

            # Pull latest containers and start stack
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: homestudio-postgres-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=homestudio
      - POSTGRES_USER=homestudio
      - POSTGRES_PASSWORD=homestudio
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata-local:

version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: homestudio-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads-volume:/var/www/uploads
    depends_on:
      - backend
      - frontend
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.homestudio.rule=Host(`homestudio.optivra.am`)"
      - "traefik.http.routers.homestudio.entrypoints=websecure"
      - "traefik.http.routers.homestudio.tls=true"
      - "traefik.http.routers.homestudio.tls.certresolver=letsencrypt"
      - "traefik.http.services.homestudio.loadbalancer.server.port=80"

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/jtechart/home-studio-backend:latest}
    container_name: homestudio-backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-shared-postgres}:${DB_PORT:-5432}/${DB_NAME:-homestudio}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - UPLOAD_DIR=/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-https://homestudio.optivra.am}
    volumes:
      - uploads-volume:/uploads
    networks:
      - default
      - db-net

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/jtechart/home-studio-frontend:latest}
    container_name: homestudio-frontend
    restart: always
    networks:
      - default

volumes:
  uploads-volume:

networks:
  web:
    external: true
  db-net:
    external: true


spring:
  application:
    name: home-studio-api

  datasource:
    url: jdbc:postgresql://localhost:5432/homestudio
    username: ${DB_USER:homestudio}
    password: ${DB_PASS:homestudio}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: 8080

app:
  admin:
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-please-use-256-bit-key}
    expiration-ms: 86400000  # 24 hours

  upload:
    dir: ${UPLOAD_DIR:./uploads}
    allowed-types: image/jpeg,image/png,image/webp,image/gif
    max-width: 2400
    thumbnail-width: 600

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
